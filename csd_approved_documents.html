<title>CSD Approved Documents - Engineers Qualification Board</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background-color: #ffffff;
        color: #000000;
    }
    .app-shell { display: flex; align-items: flex-start; }
    .app-sidebar {
        width: 220px;
        flex-shrink: 0;
        background: #0a1f44;
        min-height: 100vh;
        padding: 20px 0;
        box-sizing: border-box;
    }
    .app-sidebar .sidebar-logo { padding: 0 18px 24px; }
    .app-sidebar .sidebar-logo img {
        max-width: 100%;
        display: block;
        background: #fff;
        border-radius: 4px;
        padding: 6px;
    }
    .app-sidebar nav a {
        display: block;
        padding: 10px 18px;
        font-size: 14px;
        color: #cfe0ff;
        text-decoration: underline;
        line-height: 1.4;
    }
    .app-sidebar nav a.active { color: #ffffff; font-weight: bold; }
    .app-main { flex: 1; min-width: 0; padding: 20px; box-sizing: border-box; }

    .top-user-bar {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 14px;
        padding: 0 0 8px;
        flex-wrap: wrap;
    }
    .top-user-bar .user-email { font-size: 12px; color: #555; }
    .btn-link {
        background: none; border: none; padding: 0; font: inherit;
        font-size: 12px; font-weight: bold; cursor: pointer;
        text-decoration: underline; box-shadow: none;
    }
    .btn-link-logout { color: #dc3545; }
    .btn-link-logout:hover { color: #a71d2a; }

    h2 {
        font-size: 16px; font-weight: bold; margin: 0 0 16px;
        text-transform: uppercase; letter-spacing: 0.5px; text-align: center;
    }

    .docs-layout {
        display: flex;
        gap: 20px;
        align-items: flex-start;
    }
    .docs-notice-panel {
        width: 260px;
        flex-shrink: 0;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #f8f9fa;
        padding: 16px;
        box-sizing: border-box;
    }
    .docs-notice-panel h3 {
        font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;
        margin: 0 0 10px; color: #333;
    }
    .docs-notice-panel ul { margin: 0; padding-left: 18px; }
    .docs-notice-panel li { font-size: 13px; margin-bottom: 10px; line-height: 1.4; }
    .docs-notice-panel .notice-date { display: block; font-size: 11px; color: #777; }

    .docs-embed-wrapper {
        flex: 1;
        min-width: 0;
        border: 1px solid #ccc;
        border-radius: 6px;
        overflow: hidden;
        min-height: 640px;
    }
    .docs-embed-wrapper iframe {
        width: 100%;
        height: 640px;
        border: none;
        display: block;
    }
</style>

        <div class="docs-layout">
            <!--
                MANUAL "recently updated" panel.
                Edit the list below by hand whenever a file in the OneDrive
                folder is added or changed — add a new <li> at the top,
                delete old ones you no longer want shown. No code changes
                needed beyond editing this list.
            -->
            <div class="docs-notice-panel">
                <h3>Recently updated</h3>
                <ul id="recent-updates-list">
                    <li>
                        Example: "NGC_00008_PM_009 CSD Energization Procedure" updated.
                        <span class="notice-date">Aug 2, 2026</span>
                    </li>
                    <li>
                        Example: New template added — "CSD Project Closing".
                        <span class="notice-date">Jul 22, 2026</span>
                    </li>
                </ul>
            </div>

            <div class="docs-embed-wrapper">
                <!--
                    This loads your OneDrive folder's live file listing
                    directly — real file names and real "Last Modified"
                    dates, automatically up to date, no code involved.

                    For best reliability, replace this src with OneDrive's
                    dedicated EMBED link rather than the plain share link:
                    open the folder on onedrive.live.com -> right-click ->
                    Embed -> copy the URL out of the generated <iframe> tag
                    -> paste it here in place of the src below.
                -->
                <iframe
                    src="https://1drv.ms/f/c/9c4e6640b2f178ee/IgC4WRAlX58ESbdbD8CUfK8GAbRr3YYKpJI--VasLsMPKEQ?e=aILPJy"
                    title="CSD Approved Documents (OneDrive)"
                    allowfullscreen>
                </iframe>
            </div>
        </div>

    </div>
</div>
