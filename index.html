<!DOCTYPE html>
<html lang="en" class="auth-checking">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In - Engineers Qualification Board</title>
<style>
    html.auth-checking #login-card { visibility: hidden; }

    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #login-card {
        background: #ffffff;
        width: 100%;
        max-width: 380px;
        padding: 32px 28px;
        border-radius: 8px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.12);
        box-sizing: border-box;
        text-align: center;
    }
    #login-card img {
        display: block;
        max-height: 48px;
        margin: 0 auto 18px auto;
    }
    h1 {
        font-size: 18px;
        text-align: center;
        margin: 0 0 22px 0;
        color: #222;
    }
    button#btn-signin {
        width: 100%;
        padding: 11px;
        background: #0d6efd;
        color: #fff;
        border: none;
        border-radius: 4px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }
    button#btn-signin:disabled {
        background: #93bdfb;
        cursor: default;
    }
    button#btn-signin:hover:not(:disabled) {
        background: #0b5ed7;
    }
    #status-msg {
        margin-top: 14px;
        font-size: 13px;
        text-align: center;
        min-height: 16px;
    }
    #status-msg.error { color: #c0392b; }
    #status-msg.info { color: #555; }
</style>
</head>
<body>

<div id="login-card">
    <img src="nglogo.jpg" alt="Company logo">
    <h1>ENGINEERS QUALIFICATION BOARD<br>Sign In</h1>

    <button type="button" id="btn-signin">
        <svg width="18" height="18" viewBox="0 0 21 21" aria-hidden="true">
            <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
            <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
            <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
            <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
        </svg>
        Sign in with Microsoft
    </button>

    <div id="status-msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js"></script>
<script src="assets/js/msal-config.js"></script>
<script>
(function () {
    "use strict";

    var msalInstance = new msal.PublicClientApplication(window.MSAL_CONFIG);
    var statusEl = document.getElementById("status-msg");
    var signinBtn = document.getElementById("btn-signin");

    function pageForRole(role) {
        if (role === "internal") return "prequalformint.html";
        if (role === "external") return "prequalformcon.html";
        return null;
    }

    function showMessage(text, type) {
        statusEl.textContent = text;
        statusEl.className = type || "";
    }

    function getRoleFromAccount(account) {
        var claims = account && account.idTokenClaims;
        var roles = claims && claims.roles;
        return (roles && roles.length) ? roles[0] : null;
    }

    async function init() {
        await msalInstance.initialize();

        var redirectResult = await msalInstance.handleRedirectPromise().catch(function (err) {
            console.error("[login] redirect handling error:", err);
            // A lost redirect state (e.g. "no_cached_authority_error") can
            // happen occasionally depending on the browser/device — the
            // sign-in itself didn't fail, the browser just didn't hold onto
            // where it was mid-flow. This is recoverable: just let the
            // person try again, framed as a normal hiccup rather than a
            // technical failure.
            showMessage("That sign-in attempt didn't complete. Please click \u201cSign in with Microsoft\u201d again.", "error");
            return null;
        });

        var params = new URLSearchParams(window.location.search);
        var reason = params.get("reason");
        if (reason === "no_access") {
            showMessage("Your account does not have access assigned yet. Contact the site administrator.", "error");
        } else if (reason === "signin_required") {
            showMessage("Please sign in to continue.", "info");
        }

        var accounts = msalInstance.getAllAccounts();

        if (redirectResult && redirectResult.account) {
            accounts = [redirectResult.account];
        }

        if (!accounts.length) {
            document.documentElement.classList.remove("auth-checking");
            return;
        }

        var account = accounts[0];
        msalInstance.setActiveAccount(account);

        var role = getRoleFromAccount(account);
        var target = pageForRole(role);

        if (target) {
            window.location.replace(target);
        } else {
            // Signed in, but no app role assigned yet.
            showMessage("Your account does not have access assigned yet. Contact the site administrator.", "error");
            await msalInstance.logoutRedirect({ account: account, postLogoutRedirectUri: window.MSAL_CONFIG.postLogoutRedirectUri });
        }
    }

    init();

    signinBtn.addEventListener("click", function () {
        signinBtn.disabled = true;
        showMessage("Redirecting to Microsoft sign-in...", "info");
        msalInstance.loginRedirect({
            scopes: window.MSAL_LOGIN_SCOPES,
            // "login" forces Microsoft's page to require a full sign-in every
            // time, instead of silently reusing a browser-wide Microsoft SSO
            // session (which is what produces the fast "pick an account"
            // shortcut right after logging out — the browser can still be
            // signed into Microsoft generally even though this app's own
            // session was fully cleared).
            prompt: "login"
        }).catch(function (err) {
            showMessage("Sign in failed: " + err.message, "error");
            signinBtn.disabled = false;
        });
    });
})();
</script>

</body>
</html>
