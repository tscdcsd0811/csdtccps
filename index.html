<!DOCTYPE html>
<html lang="en" class="auth-checking">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In - Engineers Qualification Board</title>
<style>
    html.auth-checking #login-card { visibility: hidden; }

    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #login-card {
        background: #ffffff;
        width: 100%;
        max-width: 380px;
        padding: 32px 28px;
        border-radius: 8px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.12);
        box-sizing: border-box;
    }
    #login-card img {
        display: block;
        max-height: 48px;
        margin: 0 auto 18px auto;
    }
    h1 {
        font-size: 18px;
        text-align: center;
        margin: 0 0 22px 0;
        color: #222;
    }
    label {
        display: block;
        font-size: 13px;
        font-weight: bold;
        margin-bottom: 4px;
        color: #333;
    }
    input[type="email"], input[type="password"] {
        width: 100%;
        padding: 9px 10px;
        margin-bottom: 16px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
        box-sizing: border-box;
    }
    button#btn-signin {
        width: 100%;
        padding: 10px;
        background: #0d6efd;
        color: #fff;
        border: none;
        border-radius: 4px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
    }
    button#btn-signin:disabled {
        background: #93bdfb;
        cursor: default;
    }
    button#btn-signin:hover:not(:disabled) {
        background: #0b5ed7;
    }
    #status-msg {
        margin-top: 14px;
        font-size: 13px;
        text-align: center;
        min-height: 16px;
    }
    #status-msg.error { color: #c0392b; }
    #status-msg.info { color: #555; }
</style>
</head>
<body>

<div id="login-card">
    <img src="nglogo.jpg" alt="Company logo">
    <h1>ENGINEERS QUALIFICATION BOARD<br>Sign In</h1>

    <form id="loginForm" autocomplete="off">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">

        <button type="submit" id="btn-signin">Sign In</button>
    </form>

    <div id="status-msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script>
(function () {
    "use strict";

    var client = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
    var statusEl = document.getElementById("status-msg");
    var form = document.getElementById("loginForm");
    var signinBtn = document.getElementById("btn-signin");

    function pageForRole(role) {
        if (role === "internal") return "prequalformint.html";
        if (role === "external") return "prequalformcon.html";
        return null;
    }

    function showMessage(text, type) {
        statusEl.textContent = text;
        statusEl.className = type || "";
    }

    async function redirectIfAlreadySignedIn() {
        var sessionResult = await client.auth.getSession();
        var session = sessionResult && sessionResult.data ? sessionResult.data.session : null;

        if (!session) {
            document.documentElement.classList.remove("auth-checking");
            return;
        }

        var profileResult = await client
            .from("profiles")
            .select("role")
            .eq("id", session.user.id)
            .single();

        var target = profileResult.data ? pageForRole(profileResult.data.role) : null;

        if (target) {
            window.location.replace(target);
        } else {
            // Session exists but no role assigned yet - sign out and let them try again.
            await client.auth.signOut();
            document.documentElement.classList.remove("auth-checking");
        }
    }

    var params = new URLSearchParams(window.location.search);
    var reason = params.get("reason");
    if (reason === "no_access") {
        showMessage("Your account does not have access assigned yet. Contact the site administrator.", "error");
    } else if (reason === "signin_required") {
        showMessage("Please sign in to continue.", "info");
    }

    redirectIfAlreadySignedIn();

    form.addEventListener("submit", async function (event) {
        event.preventDefault();
        signinBtn.disabled = true;
        showMessage("Signing in...", "info");

        var email = document.getElementById("email").value.trim();
        var password = document.getElementById("password").value;

        var signInResult = await client.auth.signInWithPassword({ email: email, password: password });

        if (signInResult.error) {
            showMessage("Sign in failed: " + signInResult.error.message, "error");
            signinBtn.disabled = false;
            return;
        }

        var userId = signInResult.data.user.id;

        var profileResult = await client
            .from("profiles")
            .select("role")
            .eq("id", userId)
            .single();

        var target = profileResult.data ? pageForRole(profileResult.data.role) : null;

        if (!target) {
            showMessage("Your account does not have access assigned yet. Contact the site administrator.", "error");
            await client.auth.signOut();
            signinBtn.disabled = false;
            return;
        }

        window.location.replace(target);
    });
})();
</script>

</body>
</html>
